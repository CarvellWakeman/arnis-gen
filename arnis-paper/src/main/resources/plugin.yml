name: ArnisGen
version: '${version}'
main: com.arnis.paper.ArnisPlugin
api-version: '1.21'
# Enable before worlds load so the void generator is available if a server makes
# the arnis world its primary world (bukkit.yml + level-name). World creation
# itself is deferred to after startup (Bukkit forbids it during STARTUP).
load: STARTUP
authors: [arnis]
description: On-demand real-world terrain generator backed by the arnis region baker.
commands:
  arnis:
    description: Arnis terrain generator controls.
    usage: /arnis <status|prewarm [radius]|goto <lat> <lng>|reload [radius]|rebake [radius]>
    permission: arnis.use
permissions:
  arnis.use:
    description: Use the read-only arnis commands (status, goto, reload).
    # Everyone: exploring by coordinate is how players use an arnis world. The
    # subcommands that cost real work are gated separately on arnis.bake.
    default: true
  arnis.bake:
    description: Queue bakes with /arnis prewarm and /arnis rebake.
    # Ops only: each region is minutes of CPU and ~4-5 MB on disk, and nothing
    # rate-limits how often a player may ask.
    default: op
  arnis.bypass:
    description: Ignore the terrain barrier and fly into unbaked space.
    # Not granted to operators by default: an op flying past the frontier creates
    # exactly the void the barrier exists to prevent.
    default: false
